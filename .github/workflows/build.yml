name: Update Profile Stats

on:
  schedule:
    - cron: '0 0 * * *' # Executa automaticamente todo dia à meia-noite
  workflow_dispatch: # Permite rodar manualmente a qualquer momento na aba Actions

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Script
        env:
          TOKEN: ${{ secrets.PROFILE_TOKEN }}
        run: python today.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Update profile statistics" && git push)
